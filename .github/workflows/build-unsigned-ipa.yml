name: Build unsigned IPA

# Roda a cada push na main e também pode ser disparado manualmente
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    # Runner macOS — grátis e sem limite de minutos em repositório público
    runs-on: macos-14

    env:
      # AJUSTE ESTES DOIS VALORES conforme o nome real do seu projeto/scheme
      PROJECT_NAME: ClipHistory
      SCHEME_NAME: ClipHistory

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Selecionar a versão mais recente do Xcode disponível no runner
        # O runner tem várias versões do Xcode instaladas lado a lado; o symlink
        # /Applications/Xcode.app nem sempre aponta pra mais recente. O XcodeGen
        # gera o .pbxproj num formato que pode ser mais novo do que essa versão
        # "padrão" suporta (erro "future Xcode project file format"), então
        # selecionamos explicitamente a mais recente disponível.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Selecionando: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode via XcodeGen
        run: xcodegen generate

      - name: Mostrar schemes disponíveis (debug)
        run: xcodebuild -list -project "${PROJECT_NAME}.xcodeproj" || xcodebuild -list -workspace "${PROJECT_NAME}.xcworkspace"

      - name: Build sem assinatura (device genérico)
        run: |
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Empacotar .app em .ipa (sem assinar)
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado em build/Build/Products — build não produziu o app esperado."
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "App encontrado em: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${PROJECT_NAME}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Verificar estrutura do .ipa gerado (debug)
        run: |
          set -e
          IPA="${PROJECT_NAME}-unsigned.ipa"
          echo "== Conteúdo do $IPA =="
          unzip -l "$IPA"

          # Deriva o diretório do .app a partir do Info.plist (entrada de arquivo real),
          # em vez de depender de entradas de diretório existirem explicitamente no zip.
          APP_DIR=$(unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1 | sed -E 's#(Payload/[^/]+\.app/).*#\1#')
          if [ -z "$APP_DIR" ]; then
            echo "ERRO: não encontrei Payload/<Nome>.app/Info.plist dentro do .ipa — é exatamente isso que o AltServer/SideStore precisa achar."
            exit 1
          fi
          echo "App dentro do ipa: $APP_DIR"

          rm -rf ipa_check
          unzip -q "$IPA" -d ipa_check "${APP_DIR}Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "ipa_check/${APP_DIR}Info.plist")
          echo "CFBundleExecutable: $EXECUTABLE"

          unzip -q "$IPA" -d ipa_check "${APP_DIR}${EXECUTABLE}"
          if [ ! -f "ipa_check/${APP_DIR}${EXECUTABLE}" ]; then
            echo "ERRO: o binário $EXECUTABLE declarado no Info.plist não existe dentro do bundle."
            exit 1
          fi
          file "ipa_check/${APP_DIR}${EXECUTABLE}"
          echo "OK: .ipa parece estruturalmente válido."

      - name: Subir .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-nao-assinado
          path: "${{ env.PROJECT_NAME }}-unsigned.ipa"
          retention-days: 14
